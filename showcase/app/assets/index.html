<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chill TV Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0F2B2D;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;color:#fff}
.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .8s ease,visibility 0s .8s}
.screen.on{opacity:1;visibility:visible;transition:opacity .8s ease}
@keyframes kenburns{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.12) translate(-30px,-14px)}}
@keyframes kenburnsBig{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.14) translate(-40px,-20px)}}
@keyframes fill{from{width:0}to{width:100%}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes riseBig{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes ringSpin{to{transform:rotate(360deg)}}
@keyframes ringSpinRev{to{transform:rotate(-360deg)}}
@keyframes sweep{0%{transform:translateX(-120%) skewX(-18deg)}55%,100%{transform:translateX(260%) skewX(-18deg)}}
@keyframes shimmer{0%{background-position:-200% 0}60%,100%{background-position:200% 0}}
@keyframes bounce{0%{transform:scale(1.04)}40%{transform:scale(.94)}100%{transform:scale(1.04)}}

.t1{background:radial-gradient(circle at 70% 38%,#5FD3C6 0%,#1D5F5A 36%,#0C2527 76%)}
.t2{background:radial-gradient(circle at 70% 38%,#F3DDAA 0%,#A07D3E 34%,#2A2116 78%)}
.t3{background:radial-gradient(circle at 70% 38%,#9FE0D8 0%,#2F7570 36%,#0D2224 78%)}
.t4{background:radial-gradient(circle at 70% 38%,#EFD2BD 0%,#8E5E4A 36%,#24171A 80%)}
.t5{background:radial-gradient(circle at 70% 38%,#D9E8B4 0%,#5E8A4E 34%,#13261A 78%)}
.seg{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:#fff}
.seg.done i{width:100%}
.seg.on i{animation:fill 8s linear forwards}

/* ---------- TV home (glass dock) ---------- */
#home{background:#0F2B2D;font-family:Manrope,system-ui,sans-serif}
.bg{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease}
.bg.on{opacity:1}
.bg .kb{position:absolute;inset:-80px}
.bg.on .kb{animation:kenburns 9s linear forwards}
.card .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.card .slide.on{opacity:1}
.card .slide .kb{position:absolute;inset:-40px}
.card .slide.on .kb{animation:kenburns 8s linear forwards}
.card .slide.on .cap{animation:rise .9s .25s cubic-bezier(.2,.8,.2,1) both}
.glass{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
.blur .glass,.blur .dock{backdrop-filter:blur(28px) saturate(1.2);-webkit-backdrop-filter:blur(28px) saturate(1.2)}
.iconbtn{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:background .3s,transform .3s,box-shadow .3s}
.card{position:absolute;left:510px;top:196px;width:900px;height:506px;border-radius:28px;overflow:hidden;background:#0B2023;border:1px solid rgba(255,255,255,.28);box-shadow:0 40px 90px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.dock{position:absolute;left:140px;right:140px;top:772px;height:180px;box-sizing:border-box;padding:14px;border-radius:36px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.app{border-radius:26px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:background .3s,border-color .3s,transform .3s cubic-bezier(.2,.8,.2,1)}
.app .lb{font-size:26px;font-weight:500;opacity:.82;transition:opacity .3s}
.focus.app{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.32);transform:scale(1.04)}
.focus.app .lb{opacity:1}
.focus.iconbtn{background:rgba(255,255,255,.32);transform:scale(1.08);box-shadow:0 0 0 2px #fff}
.focus.card{transform:scale(1.025);box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 4px #fff}
.app.go{animation:bounce .45s ease}
#toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);padding:12px 26px;border-radius:999px;background:rgba(0,0,0,.55);font-size:20px;opacity:0;transition:opacity .4s}
#toast.on{opacity:1}

/* ---------- Showcase (idle) ---------- */
#showcase{background:#0F2B2D;font-family:Inter,system-ui,sans-serif;color:#F4F1EA}
#showcase .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
#showcase .slide.on{opacity:1}
#showcase .slide .pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#hMusic,#scMusic{opacity:0;transition:opacity 2s ease}
#hMusic.on,#scMusic.on{opacity:1;transition:opacity .6s ease}
#scMusic{position:absolute;right:28px;bottom:18px;font-size:14px;color:rgba(255,255,255,.85);text-shadow:0 1px 4px rgba(0,0,0,.6)}
.idlepics #showcase header,.idlepics #showcase footer{display:none!important}
#showcase .slide .kb{position:absolute;inset:-80px}
#showcase .slide.on .kb{animation:kenburnsBig 9s linear forwards}
#showcase .slide.on .k1{animation:riseBig .9s .2s cubic-bezier(.2,.8,.2,1) both}
#showcase .slide.on .k2{animation:riseBig 1s .4s cubic-bezier(.2,.8,.2,1) both}
#showcase .slide.on .k3{animation:riseBig 1s .6s cubic-bezier(.2,.8,.2,1) both}
#showcase .slide.on .k4{animation:riseBig 1s .8s cubic-bezier(.2,.8,.2,1) both}
#showcase .slide.on .frame{animation:fadeIn 1.4s .3s ease both}
.ring{transform-origin:50% 50%;animation:ringSpin 30s linear infinite}
.ring2{transform-origin:50% 50%;animation:ringSpinRev 44s linear infinite}
.sheen{position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.18) 50%,rgba(255,255,255,0) 100%);animation:sweep 6s ease-in-out infinite}
.gold{background:linear-gradient(100deg,#E8C979 30%,#FFF4D8 50%,#E8C979 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s ease-in-out infinite}
#showcase .seg{background:rgba(255,255,255,.22)}
#showcase .seg i{background:#F4F1EA}
/* Lite: no never-ending animations (slow boxes paint the WebView in software). */
.lite .ring,.lite .ring2,.lite .sheen,.lite .gold,.lite .bg.on .kb,.lite .card .slide.on .kb,.lite #showcase .slide.on .kb{animation:none}
.lite .gold{color:#E8C979;background:none}
.lite .seg.on i{animation:none;width:100%;opacity:.55}
.lite .sheen{display:none}
#reel{background:radial-gradient(circle at 50% 50%,#1D5F5A 0%,#0F2B2D 55%,#081819 100%);font-family:Inter,system-ui,sans-serif;color:#F4F1EA}
#reel video{position:absolute;left:50%;top:0;height:1080px;width:auto;max-width:900px;transform:translateX(-50%);background:#000;box-shadow:0 0 120px rgba(0,0,0,.6)}
.card .ad{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease;background:#0B2023}
.card .ad.on{opacity:1}
.card .ad .fill{display:none}
.card .ad .img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card.has-ads #cardLabel{display:none}
/* dock tiles: app thumbnail on glass, rotating RGB border with a colour-cycling glow */
@keyframes hueGlow{to{filter:hue-rotate(360deg)}}
#home .dock.tiles,#home.has-ads .dock.tiles{left:405px;right:405px;top:918px;height:124px;padding:0;gap:18px;background:none;border:none}
#home .dock.tiles .app{position:relative;border:none;background:none;gap:0;transform:translateZ(0)}
.app .glow{position:absolute;inset:-2px;border-radius:18px;box-shadow:0 0 12px 2px #ff3d7f,0 0 4px 1px #ff3d7f;opacity:.55;animation:hueGlow 6s linear infinite;transition:opacity .3s}
.app .rgb{position:absolute;inset:-2px;border-radius:18px;overflow:hidden}
.app .rgb i{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;background:conic-gradient(#ff2d6f,#ff9a1f,#ffe14d,#36f08a,#1fc8ff,#7b5cff,#ff3df0,#ff2d6f);animation:ringSpin 3.6s linear infinite}
.app .face{position:absolute;inset:0;border-radius:16px;background:rgba(8,22,24,.72);display:flex;flex-direction:column;align-items:stretch;padding:9px 9px 7px;gap:6px;box-sizing:border-box;overflow:hidden}
.app .face:before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,0) 45%);pointer-events:none}
.app .thumb{position:relative;flex:none;aspect-ratio:16/9;border-radius:9px;overflow:hidden;background:#0B2023;display:flex;align-items:center;justify-content:center}
.app .thumb img.banner{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.app .thumb img.icon{width:56px;height:56px;object-fit:contain}
#home .dock.tiles .app .lb{font-size:16px;text-align:center;line-height:1;opacity:.9}
#home .dock.tiles .focus.app{background:none;transform:scale(1.05)}
/* only the focused tile gets the RGB border and glow; the others are plain glass */
#home .dock.tiles .app:not(.focus) .rgb,#home .dock.tiles .app:not(.focus) .glow{display:none}
#home .dock.tiles .app .face{background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 1px rgba(255,255,255,.24)}
#home .dock.tiles .focus.app .face{background:rgba(10,24,26,.78);box-shadow:none}
#home .dock.tiles .focus.app .glow{opacity:.85;box-shadow:0 0 16px 3px #ff3d7f,0 0 5px 1px #ff3d7f}
#adFrame{position:absolute;left:336px;top:190px;width:1248px;height:702px;border-radius:28px;overflow:hidden;background:#0B2023;border:1px solid rgba(255,255,255,.28);box-shadow:0 40px 90px rgba(0,0,0,.5)}
#adFrame .adbg{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease;background:#0F2B2D}
#adFrame .adbg.on{opacity:1}
#home.has-ads #homeScrim{background:linear-gradient(180deg,rgba(4,12,13,.62) 0%,rgba(4,12,13,0) 24%,rgba(4,12,13,0) 62%,rgba(4,12,13,.6) 100%)!important}
#adFrame .adbg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#home.has-ads .dock{background:rgba(6,18,20,.62);border-color:rgba(255,255,255,.22)}
#home.has-ads .glass{background:rgba(6,18,20,.55)}
</style>
</head>
<body>
<div id="stage">

<!-- ======================= TV home ======================= -->
<section id="home" class="screen on" aria-label="Home">
  <div id="homeBg"></div>
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,12,13,.45) 0%,rgba(4,12,13,.15) 40%,rgba(4,12,13,.55) 100%)" id="homeScrim"></div>

  <div style="position:absolute;left:140px;top:48px;display:flex;flex-direction:column;gap:4px">
    <div id="hTime" style="font-size:64px;font-weight:300;line-height:1;letter-spacing:-.01em"></div>
    <div id="hDate" style="font-size:20px;font-weight:400;color:rgba(255,255,255,.82)"></div>
    <div id="hMusic" style="font-size:16px;font-weight:400;color:rgba(255,255,255,.62);margin-top:2px;line-height:1.3"></div>
  </div>


  <div style="position:absolute;right:140px;top:74px;display:flex;gap:14px">
    <div class="iconbtn glass" data-act="showcase" aria-label="Open full showcase"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></div>
    <div class="iconbtn glass" data-act="allapps" aria-label="All apps"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></div>
    <div class="iconbtn glass" data-act="remote" aria-label="Remote pairing code"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><circle cx="12" cy="9" r="2"/><path d="M10 14.5h4M10 17.5h4"/></svg></div>
    <div class="iconbtn glass" data-act="settings" aria-label="Settings"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></div>
  </div>

  <div id="adFrame" aria-hidden="true"></div>

  <nav class="dock" aria-label="Apps">
    <div class="app" data-act="reel"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#E8C979" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M10 8.5v7l6-3.5z" fill="#E8C979"/></svg><span class="lb" id="reelLabel">Our Reel</span></div>
    <div class="app" data-act="nf"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span class="lb">Netflix</span></div>
    <div class="app" data-act="hbo"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M7 6l2-3M17 6l-2-3M10 10v4l3.5-2z"/></svg><span class="lb">HBO Max</span></div>
    <div class="app" data-act="dis"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/></svg><span class="lb">Disney+</span></div>
    <div class="app" data-act="prime"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/></svg><span class="lb">Prime Video</span></div>
    <div class="app" data-act="play"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.5v17l14-8.5z"/><path d="M5 3.5l9.5 11M5 20.5l9.5-11"/></svg><span class="lb">Google Play</span></div>
  </nav>
  <div id="toast"></div>
</section>

<!-- ======================= Reel ======================= -->
<section id="reel" class="screen" aria-label="Reel">
  <div style="position:absolute;left:110px;top:0;bottom:0;width:380px;display:flex;flex-direction:column;justify-content:center;gap:18px">
    <svg width="96" height="96" viewBox="0 0 220 220" fill="none" aria-hidden="true"><circle cx="110" cy="110" r="96" stroke="rgba(63,193,180,.6)" stroke-width="4"/><circle cx="110" cy="110" r="76" stroke="#E8C979" stroke-width="5"/><text class="bInit" x="110" y="142" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="100" font-weight="600" fill="#F4F1EA">Y</text></svg>
    <div class="bName" style="font-family:'Cormorant Garamond',Georgia,serif;font-size:64px;font-weight:600;line-height:1;letter-spacing:.06em;color:#E8C979;text-transform:uppercase"></div>
    <div class="bTag" style="font-size:16px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:rgba(244,241,234,.8)"></div>
  </div>
  <video id="reelVideo" preload="metadata" playsinline></video>
  <div style="position:absolute;right:110px;top:0;bottom:0;width:380px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:16px;text-align:right">
    <div id="reelKicker" style="font-size:18px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#E8C979"></div>
    <div id="reelTitle" style="font-family:'Cormorant Garamond',Georgia,serif;font-size:76px;font-weight:600;line-height:.95"></div>
    <div id="reelLine" style="font-size:24px;font-weight:300;line-height:1.4;color:rgba(244,241,234,.88)"></div>
    <div id="reelCount" style="margin-top:28px;font-size:18px;color:rgba(244,241,234,.6)"></div>
  </div>
</section>

<!-- ======================= Showcase (idle) ======================= -->
<section id="showcase" class="screen" aria-label="Showcase">
  <div id="scSlides"></div>
  <div id="scMusic"></div>
  <header style="position:absolute;left:120px;right:120px;top:56px;display:flex;justify-content:space-between;align-items:center">
    <div style="display:flex;align-items:center;gap:18px">
      <svg width="64" height="64" viewBox="0 0 220 220" fill="none" role="img" aria-label="Logo">
        <g class="ring"><circle cx="110" cy="110" r="96" stroke="rgba(63,193,180,.6)" stroke-width="4"/><circle cx="110" cy="14" r="8" fill="#3FC1B4"/></g>
        <circle cx="110" cy="110" r="76" stroke="#E8C979" stroke-width="5"/>
        <text class="bInit" x="110" y="142" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="100" font-weight="600" fill="#F4F1EA">Y</text>
      </svg>
      <div style="display:flex;flex-direction:column;gap:2px">
        <div class="gold bName" style="font-family:'Cormorant Garamond',Georgia,serif;font-size:38px;font-weight:600;line-height:1;letter-spacing:.06em;text-transform:uppercase"></div>
        <div class="bTag" style="font-size:13px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:rgba(244,241,234,.8)"></div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
      <div style="font-size:40px;font-weight:300;line-height:1"><span id="sTime"></span><span id="sAmpm" style="font-size:20px;font-weight:500;margin-left:6px;color:rgba(244,241,234,.8)"></span></div>
      <div id="sDate" style="font-size:16px;color:rgba(244,241,234,.8)"></div>
    </div>
  </header>
  <footer style="position:absolute;left:120px;right:120px;bottom:60px;display:flex;align-items:center;gap:40px">
    <div id="scSegs" style="flex:1;display:flex;gap:10px"></div>
    <div class="bWeb" style="font-size:18px;color:rgba(244,241,234,.85)"></div>
  </footer>
</section>
</div>

<script src="config.js"></script>
<script>
'use strict';
// ---- content: all of it comes from config.js ----
var C = window.CHILL || {};
var B = C.brand || {};
var SLIDES = C.slides && C.slides.length ? C.slides : [{ tint: 't1', kicker: '', title: B.name || '', line: '', long: '' }];
// First installed package wins (TV build first).
var APPS = {
  nf: { name: 'Netflix', pkgs: 'com.netflix.ninja' },
  hbo: { name: 'HBO Max', pkgs: 'com.wbd.stream' },
  dis: { name: 'Disney+', pkgs: 'com.disneyplus.ph,com.disney.disneyplus' },
  prime: { name: 'Prime Video', pkgs: 'com.amazon.amazonvideo.livingroom' },
  play: { name: 'Google Play', pkgs: 'com.android.vending' }
};
var ADS = C.ads || [];
var IDLE_PICS = C.idlePictures || [];
var REELS = C.reels || [];
var IDLE_MS = (C.idleMinutes || 3) * 60 * 1000;   // home → Showcase after this long without a key press
var SLIDE_MS = (C.slideSeconds || 8) * 1000;
var LOCN = C.location || {};
var TZ = LOCN.timeZone || (function () { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (e) { return 'UTC'; } })();
var LAT = LOCN.lat, LON = LOCN.lon, PLACE = LOCN.place || '';

var hasTV = typeof window.TV !== 'undefined';
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
try { if (localStorage.getItem('lite') !== '0') document.body.classList.add('lite'); if (localStorage.getItem('blur') === '1') document.body.classList.add('blur'); } catch (e) {}

// ---- fit the 1920×1080 design to the screen ----
function fit() {
  var w = window.innerWidth, h = window.innerHeight;
  try { if (hasTV) { var d = TV.screen().split(','); if (+d[0] > 0) { w = +d[0]; h = +d[1]; } } } catch (e) {}
  var s = Math.min(w / 1920, h / 1080);
  var st = $('stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((w - 1920 * s) / 2) + 'px';
  st.style.top = ((h - 1080 * s) / 2) + 'px';
  console.log('fit ' + w + 'x' + h + ' dpr ' + window.devicePixelRatio + ' scale ' + s);
}
window.addEventListener('resize', fit); fit(); setTimeout(fit, 500);

// ---- slides ----
(function build() {
  var bg = '', card = '', segs = '', sc = '';
  SLIDES.forEach(function (s, n) {
    bg += '<div class="bg"><div class="kb ' + s.tint + '"></div></div>';
    card += '<div class="slide"><div class="kb ' + s.tint + '"></div>' +
      '<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(5,12,13,.82) 100%)"></div>' +
      '<div class="cap" style="position:absolute;left:48px;right:48px;bottom:48px;display:flex;flex-direction:column;gap:10px">' +
      '<div style="font-size:16px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#E8C979">' + esc(s.kicker) + '</div>' +
      '<div style="font-family:\'Cormorant Garamond\',Georgia,serif;font-size:68px;font-weight:600;line-height:1">' + esc(s.title) + '</div>' +
      '<div style="font-size:22px;font-weight:300;color:rgba(255,255,255,.88)">' + esc(s.line) + '</div></div></div>';
    segs += '<span class="seg"><i></i></span>';
    sc += '<div class="slide"><div class="kb ' + s.tint + '" style="background-position:74% 44%"></div>' +
      '<div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,16,17,.78) 0%,rgba(6,16,17,.35) 48%,rgba(6,16,17,0) 70%)"></div>' +
      '<div class="frame" style="position:absolute;left:1150px;top:210px;width:600px;height:600px">' +
      '<svg class="ring2" width="600" height="600" viewBox="0 0 600 600" fill="none" style="position:absolute;inset:0"><circle cx="300" cy="300" r="296" stroke="rgba(244,241,234,.22)" stroke-width="1.5" stroke-dasharray="3 12"/></svg>' +
      '<svg class="ring" width="600" height="600" viewBox="0 0 600 600" fill="none" style="position:absolute;inset:0"><circle cx="300" cy="300" r="270" stroke="rgba(232,201,121,.55)" stroke-width="2" stroke-dasharray="420 1276" stroke-linecap="round"/><circle cx="300" cy="30" r="7" fill="#E8C979"/></svg>' +
      '<div style="position:absolute;left:50px;top:50px;width:500px;height:500px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center">' +
      '<div class="sheen"></div>' +
      '<svg width="120" height="120" viewBox="0 0 220 220" fill="none" aria-hidden="true"><circle cx="110" cy="110" r="76" stroke="#E8C979" stroke-width="4"/><text x="110" y="142" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="100" font-weight="600" fill="#F4F1EA">' + esc(B.initial || '') + '</text></svg>' +
      '</div></div>' +
      '<div style="position:absolute;left:120px;top:300px;width:960px;display:flex;flex-direction:column;gap:22px">' +
      '<div class="k1" style="display:flex;align-items:center;gap:16px;font-size:20px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#E8C979"><span>' + ('0' + (n + 1)).slice(-2) + '</span><span style="width:48px;height:2px;background:#E8C979"></span><span>' + esc(s.kicker) + '</span></div>' +
      '<div class="k2" style="font-family:\'Cormorant Garamond\',Georgia,serif;font-size:150px;font-weight:600;line-height:.92;letter-spacing:-.01em">' + esc(s.title) + '</div>' +
      '<div class="k3" style="font-size:32px;font-weight:300;line-height:1.4;color:rgba(244,241,234,.9);max-width:820px">' + esc(s.long) + '</div>' +
      '<div class="k4" style="display:flex;align-items:center;gap:14px;margin-top:18px"><span style="padding:16px 30px;border-radius:999px;background:#F4F1EA;color:#1F4F52;font-size:20px;font-weight:600">' + esc(B.cta || '') + '</span><span style="font-size:20px;color:rgba(244,241,234,.85)">' + esc(B.ctaNote || '') + '</span></div>' +
      '</div></div>';
  });
  $('homeBg').innerHTML = bg;
  if (ADS.length) {
    var ads = '';
    ADS.forEach(function (src) { ads += '<div class="adbg"><img src="' + esc(src) + '" alt=""></div>'; });
    $('adFrame').innerHTML = ads;
  }
  if (IDLE_PICS.length === SLIDES.length) {
    sc = '';
    IDLE_PICS.forEach(function (src) { sc += '<div class="slide"><img class="pic" src="' + esc(src) + '" alt=""></div>'; });
    document.body.classList.add('idlepics');
  }
  $('scSlides').innerHTML = sc; $('scSegs').innerHTML = segs;
})();

// ---- brand text from config.js ----
(function () {
  function each(cls, f) { Array.prototype.forEach.call(document.getElementsByClassName(cls), f); }
  each('bInit', function (el) { el.textContent = B.initial || ''; });
  each('bName', function (el) { el.textContent = B.name || ''; });
  each('bTag', function (el) { el.textContent = B.tagline || ''; });
  each('bWeb', function (el) { el.textContent = B.website || ''; });
  $('reelLabel').textContent = C.reelLabel || 'Our Reel';
  if (B.name) document.title = B.name + ' · Chill TV';
  // No reels: no reel tile.
  if (!REELS.length) { var rt = document.querySelector('#home .app[data-act="reel"]'); if (rt) rt.parentNode.removeChild(rt); }
})();

// ---- dock tiles: each app shows its own TV banner (or icon); the reel tile shows its picture ----
(function () {
  var dock = document.querySelector('#home .dock'); dock.classList.add('tiles');
  Array.prototype.forEach.call(dock.querySelectorAll('.app'), function (el) {
    var lb = el.querySelector('.lb'), svg = el.querySelector('svg'), act = el.getAttribute('data-act');
    el.innerHTML = '<span class="glow"></span><span class="rgb"><i></i></span><span class="face"><span class="thumb"></span></span>';
    var thumb = el.querySelector('.thumb'); el.querySelector('.face').appendChild(lb);
    var src = '', kind = '';
    if (act === 'reel') { if (C.reelThumb) { src = C.reelThumb; kind = 'banner'; } }
    else if (hasTV && APPS[act] && TV.banner) { var r = TV.banner(APPS[act].pkgs) || ''; if (r) { kind = r.charAt(0) === 'B' ? 'banner' : 'icon'; src = r.slice(2); } }
    if (src) thumb.innerHTML = '<img class="' + kind + '" src="' + src + '" alt="">'; else thumb.appendChild(svg);
  });
})();

var idx = 0;
function mark(sel, at, segs) {
  var els = document.querySelectorAll(sel);
  for (var n = 0; n < els.length; n++) {
    if (segs) { els[n].className = 'seg'; void els[n].offsetWidth; els[n].className = 'seg' + (n < at ? ' done' : n === at ? ' on' : ''); }
    else els[n].className = els[n].className.replace(/\s*\bon\b/g, '') + (n === at ? ' on' : '');
  }
}
var adIdx = 0;
function showSlide(i) {
  idx = i;
  mark('#homeBg .bg', i);
  mark('#scSlides .slide', i); mark('#scSegs .seg', i, true);
}
function showAd(i) { adIdx = i; mark('#adFrame .adbg', i); }
showSlide(0);
setInterval(function () { showSlide((idx + 1) % SLIDES.length); }, SLIDE_MS);
if (ADS.length) { showAd(0); setInterval(function () { showAd((adIdx + 1) % ADS.length); }, SLIDE_MS); }

// ---- clock + weather ----
var weather = '';
function tick() {
  var now = new Date();
  var parts = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit', hour12: true }).formatToParts(now);
  function p(t) { for (var k = 0; k < parts.length; k++) if (parts[k].type === t) return parts[k].value; return ''; }
  var date = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'long', month: 'long', day: 'numeric' }).format(now);
  $('hTime').textContent = p('hour') + ':' + p('minute');
  $('sTime').textContent = p('hour') + ':' + p('minute');
  $('sAmpm').textContent = p('dayPeriod');
  var line = date + (weather ? ' · ' + weather : '');
  $('hDate').textContent = line; $('sDate').textContent = line;
}
tick(); setInterval(tick, 10000);
function loadWeather() {
  if (LAT == null || LON == null) return;
  fetch('https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON + '&current=temperature_2m&timezone=auto')
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d && d.current) { weather = Math.round(d.current.temperature_2m) + '° ' + PLACE; tick(); } })
    .catch(function () {});
}
loadWeather(); setInterval(loadWeather, 30 * 60 * 1000);

// ---- screens ----
// ---- background music (config.js): quiet, loops; pauses for the reel and while another app is open ----
// Each track's credit shows when it starts (some licences, e.g. CC BY, require it).
var MUSIC = C.music || [];
var MUSIC_VOLUME = C.musicVolume != null ? C.musicVolume : 0.35;   // of the TV's own volume
var music = new Audio(), musicIdx = 0, musicOn = true, creditT;
music.volume = MUSIC_VOLUME; music.preload = 'auto';
function musicCredit() {
  var t = MUSIC[musicIdx], line = '♪ ' + t.title + ' — ' + t.by;
  $('hMusic').textContent = line; $('scMusic').textContent = line;
  // shown briefly when each piece starts, then faded out (the CC BY track still gets its credit)
  $('hMusic').className = $('scMusic').className = 'on';
  clearTimeout(creditT); creditT = setTimeout(function () { $('hMusic').className = $('scMusic').className = ''; }, 8000);
}
function musicLoad(i) { musicIdx = i % MUSIC.length; music.src = MUSIC[musicIdx].src; musicCredit(); }
function musicPlay() { if (!musicOn || !MUSIC.length) return; var p = music.play(); if (p && p.catch) p.catch(function () {}); }
function musicPause() { music.pause(); }
music.addEventListener('ended', function () { musicLoad(musicIdx + 1); musicPlay(); });
music.addEventListener('error', function () { setTimeout(function () { musicLoad(musicIdx + 1); musicPlay(); }, 1000); });
if (MUSIC.length) { musicLoad(0); musicPlay(); }

var mode = 'home';
function setMode(m) {
  if (m === 'reel') musicPause(); else musicPlay();
  mode = m;
  $('home').className = 'screen' + (m === 'home' ? ' on' : '');
  $('showcase').className = 'screen' + (m === 'showcase' ? ' on' : '');
  $('reel').className = 'screen' + (m === 'reel' ? ' on' : '');
  var v = $('reelVideo');
  if (m === 'reel') playReel(0); else { v.pause(); v.removeAttribute('src'); v.load(); }
  if (m === 'showcase') showSlide(0);
}

// ---- remote focus: rows top (icons), card, dock ----
var rows = [
  Array.prototype.slice.call(document.querySelectorAll('#home .iconbtn')),
  Array.prototype.slice.call(document.querySelectorAll('#home .app'))
];
var fr = 1, fc = 0, last = { 0: 2, 1: 0 };
function paintFocus() {
  rows.forEach(function (r) { r.forEach(function (el) { el.classList.remove('focus'); }); });
  rows[fr][fc].classList.add('focus');
}
paintFocus();
function move(dr, dc) {
  if (dr) {
    var nr = Math.max(0, Math.min(rows.length - 1, fr + dr));
    if (nr === fr) return;
    last[fr] = fc; fr = nr;
    fc = Math.min(last[fr] != null ? last[fr] : 0, rows[fr].length - 1);
  } else {
    fc = Math.max(0, Math.min(rows[fr].length - 1, fc + dc));
  }
  paintFocus();
}
var toastT;
function toast(msg, ms) { var t = $('toast'); t.textContent = msg; t.className = 'on'; clearTimeout(toastT); toastT = setTimeout(function () { t.className = ''; }, ms || 3500); }
function activate(el) {
  var act = el.getAttribute('data-act');
  if (el.classList.contains('app')) { el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); }
  if (act === 'reel') { setMode('reel'); return; }
  if (act === 'showcase') { setMode('showcase'); return; }
  if (act === 'remote') {
    // The phone/laptop remote asks for this TV's address and pairing code (each TV makes its own; PairingCode.java).
    if (!(hasTV && TV.remotePairing)) return;
    var p = JSON.parse(TV.remotePairing());
    var code = p.code.length === 8 ? p.code.slice(0, 4) + '-' + p.code.slice(4) : p.code;
    toast('Remote pairing code ' + code + '  ·  TV address ' + (p.address || 'not on a network yet'), 30000);
    return;
  }
  if (act === 'settings') { if (hasTV) TV.openSettings(); return; }
  if (act === 'allapps') { if (hasTV) TV.allApps(); return; }
  var app = APPS[act];
  if (!app || !hasTV) return;
  setTimeout(function () {
    if (!TV.launch(app.pkgs)) { toast(app.name + ' is not installed. Opening Google Play…'); TV.store(app.pkgs.split(',')[0]); }
  }, 300);
}

var idleT;
function resetIdle() { clearTimeout(idleT); idleT = setTimeout(function () { if (mode === 'home') setMode('showcase'); }, IDLE_MS); }
resetIdle();

document.addEventListener('keydown', function (e) {
  resetIdle();
  if (mode === 'showcase') { setMode('home'); e.preventDefault(); return; }   // any key wakes the home screen
  if (mode === 'reel') { if (e.keyCode === 13 || e.keyCode === 23) setMode('home'); else if (e.keyCode === 39 && reelIdx + 1 < REELS.length) playReel(reelIdx + 1); else if (e.keyCode === 37 && reelIdx > 0) playReel(reelIdx - 1); e.preventDefault(); return; }
  switch (e.keyCode) {
    case 37: move(0, -1); break;
    case 39: move(0, 1); break;
    case 38: move(-1, 0); break;
    case 40: move(1, 0); break;
    case 13: case 23: case 32: activate(rows[fr][fc]); break;
    default: return;
  }
  e.preventDefault();
});
document.addEventListener('click', function (e) {
  resetIdle();
  if (mode !== 'home') { setMode('home'); return; }
  var el = e.target.closest('[data-act]');
  if (el) activate(el);
});
var reelIdx = 0;
function playReel(i) {
  reelIdx = i;
  var r = REELS[i], v = $('reelVideo');
  $('reelKicker').textContent = r.kicker; $('reelTitle').textContent = r.title; $('reelLine').textContent = r.line;
  $('reelCount').textContent = (i + 1) + ' of ' + REELS.length + ' · Back to return';
  v.src = r.src;
  v.volume = MUSIC_VOLUME;   // level your reels and music alike (e.g. -24 LUFS) so they match
  v.play().catch(function (e) { console.log('reel play: ' + e); });
}
$('reelVideo').addEventListener('playing', function () { console.log('reel playing ' + REELS[reelIdx].src + ' ' + this.videoWidth + 'x' + this.videoHeight); });
$('reelVideo').addEventListener('ended', function () {
  if (reelIdx + 1 < REELS.length) playReel(reelIdx + 1); else { setMode('home'); resetIdle(); }
});
window.onBack = function () { resetIdle(); if (mode !== 'home') setMode('home'); else { fr = rows.length - 1; fc = 0; paintFocus(); } };
window.onHomeResume = function () { resetIdle(); setMode('home'); musicPlay(); };
window.onHomePause = function () { musicPause(); };
// remote control (Mac dock / remote page): switch screen, music on/off
window.remoteMode = function (m) { resetIdle(); setMode(m === 'showcase' || m === 'reel' ? m : 'home'); if (m === 'home') { fr = rows.length - 1; fc = 0; paintFocus(); } };
window.setMusic = function (on) { musicOn = !!on; if (musicOn && mode !== 'reel') musicPlay(); else musicPause(); };
</script>
</body>
</html>
