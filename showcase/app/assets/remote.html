<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chill TV Remote</title>
<style>
:root{--bg:#0e1a1c;--panel:rgba(20,34,36,.92);--line:rgba(255,255,255,.12);--text:#f4f1ea;--dim:rgba(244,241,234,.6);--accent:#3fc1b4;--gold:#e8c979}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.cap{max-width:420px;margin:16px auto;padding:16px;border-radius:24px;background:var(--panel);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dot{width:12px;height:12px;border-radius:50%;background:#888;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.dot.ok{background:var(--accent)}.dot.bad{background:#e0574f}
.top b{font-size:16px;letter-spacing:.04em}.top span{margin-left:auto;color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);border-radius:14px;
  min-height:48px;padding:8px;font:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center}
button:hover{background:rgba(255,255,255,.12)}button:active{transform:scale(.97)}
button.home{grid-column:1/-1;background:rgba(63,193,180,.18);border-color:rgba(63,193,180,.5);font-weight:600}
h3{margin:16px 2px 8px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.vol{display:grid;grid-template-columns:48px 1fr 48px 64px;gap:8px;align-items:center}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.msg{margin-top:12px;min-height:18px;color:var(--dim);font-size:13px}
</style>
</head>
<body>
<div class="cap">
  <div class="top"><div class="dot" id="dot"></div><b>CHILL TV</b><span id="state">connecting…</span></div>
  <div class="grid">
    <button class="home" data-c="/api/home">⌂ Home (close app)</button>
    <button data-c="/api/open?app=nf">Netflix</button>
    <button data-c="/api/open?app=hbo">HBO Max</button>
    <button data-c="/api/open?app=dis">Disney+</button>
    <button data-c="/api/open?app=prime">Prime Video</button>
    <button data-c="/api/open?app=play">Google Play</button>
    <button data-c="/api/reel">▶ Reel</button>
    <button data-c="/api/showcase">Idle screen</button>
    <button data-c="/api/apps">Apps</button>
    <button data-c="/api/key?code=back">◀ Back</button>
    <button id="music" data-c="/api/music?on=0">♪ Music on</button>
  </div>
  <h3>Playing</h3>
  <div class="grid">
    <button data-c="/api/media?c=rew">⏪ Rewind</button>
    <button data-c="/api/media?c=playpause">⏯ Play/Pause</button>
    <button data-c="/api/media?c=ff">⏩ Forward</button>
  </div>
  <h3>Volume</h3>
  <div class="vol">
    <button data-c="/api/vol?d=down" aria-label="Volume down">−</button>
    <div class="bar"><i id="bar"></i></div>
    <button data-c="/api/vol?d=up" aria-label="Volume up">+</button>
    <button data-c="/api/vol?d=mute" id="mute">Mute</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
'use strict';
var key = new URLSearchParams(location.search).get('k') || '';
function $(id) { return document.getElementById(id); }
function show(s) {
  if (!s || !s.ok) return;
  $('bar').style.width = Math.round(100 * s.volume / Math.max(1, s.max)) + '%';
  $('mute').textContent = s.muted ? 'Unmute' : 'Mute';
  $('music').textContent = s.music ? '♪ Music on' : '♪ Music off';
  $('music').setAttribute('data-c', '/api/music?on=' + (s.music ? 0 : 1));
  $('state').textContent = 'volume ' + s.volume + '/' + s.max + (s.muted ? ' · muted' : '');
}
function call(path) {
  var url = path + (path.indexOf('?') < 0 ? '?' : '&') + 'k=' + encodeURIComponent(key);
  return fetch(url, { cache: 'no-store' }).then(function (r) {
    $('dot').className = 'dot ' + (r.ok ? 'ok' : 'bad');
    if (!r.ok) throw new Error(r.status === 403 ? 'wrong key' : 'error ' + r.status);
    return r.json();
  }).then(function (j) { $('msg').textContent = ''; return j; })
    .catch(function (e) { $('dot').className = 'dot bad'; $('state').textContent = 'offline'; $('msg').textContent = String(e.message || e); });
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('button[data-c]'); if (!b) return;
  var c = b.getAttribute('data-c');
  call(c).then(function (j) { if (j && j.volume != null) show(j); else call('/api/status').then(show); });
});
// status only when the page is opened or shown again: nothing runs in the background
call('/api/status').then(show);
document.addEventListener('visibilitychange', function () { if (!document.hidden) call('/api/status').then(show); });
</script>
</body>
</html>
